<style>
/* ==== 1% Club kit v2 — paste whole into every board's <style>, before board-specific rules ==== */
/* tokens: same OFFER values as v38, now named */
.pc{--ink:#111111;--ink2:#2A2A2E;--paper:#F3F3F1;--card:#FFFFFF;--sunk:#E9E9E6;--rule:#DADAD6;--rule2:#E4E4E0;--edge:#D0D0CB;
--mute:#5F5F64;--mute2:#4A4A50;--faint:#6C6C70;--blue:#395DED;--blueT:#2948C6;--wash:#EEF1FF;--spark:#F46835;
--okD:#12B76A;--okT:#067647;--okW:#ECFDF3;--warnD:#EE953A;--warnT:#B54708;--warnW:#FFFAEB;--badD:#E55446;--badT:#B42318;--badW:#FEF3F2;
--e-ui:cubic-bezier(.2,0,0,1);--e-in:cubic-bezier(.16,1,.3,1);--e-draw:cubic-bezier(.65,0,.35,1);
--fd:'Inter Tight',Inter,'Inter Fallback',system-ui,sans-serif;--ft:Inter,'Inter Fallback',system-ui,sans-serif;
color:var(--ink);font-family:var(--ft);font-feature-settings:'cv11' 1;-webkit-font-smoothing:antialiased;background:var(--paper);min-height:100vh;
font-kerning:normal;text-rendering:optimizeLegibility;letter-spacing:-0.006em}
@font-face{font-family:'Inter Fallback';src:local('Arial');size-adjust:107%;ascent-override:90%;descent-override:22.5%;line-gap-override:0%}
html{scrollbar-gutter:stable}
body{margin:0;background:#F3F3F1}
a{color:var(--ink)}a:hover{color:var(--blue)}
p,li,dd,dt,summary,figcaption{text-wrap:pretty} h1,h2,h3,legend{text-wrap:balance}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
*{scroll-margin-block:96px 140px}
.pscroll *{scroll-margin-block:16px 120px}
/* type */
.d1{margin:0;font:500 clamp(44px,4.6vw,64px)/1.02 var(--fd);letter-spacing:-0.035em}
.h1{margin:0;font:500 40px/1.08 var(--fd);letter-spacing:-0.03em}
.h2{margin:0;font:500 28px/1.12 var(--fd);letter-spacing:-0.024em}
.h3{margin:0;font:500 19px/1.3 var(--fd);letter-spacing:-0.014em}
.lead{margin:0;font-size:18px;line-height:1.55;color:var(--mute);max-width:62ch}
.body{margin:0;font-size:15.5px;line-height:1.6;color:var(--mute2);max-width:65ch}
.meta{margin:0;font-size:13.5px;line-height:1.45;color:var(--mute);letter-spacing:.004em}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font:500 15px/1 var(--ft);text-decoration:none;cursor:pointer;border:0;box-sizing:border-box;white-space:nowrap;
transition:transform .12s var(--e-ui),background-color .15s ease,box-shadow .15s ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:44px;padding:0 16px}
.btn.full{width:100%;min-height:56px;border-radius:12px;font-size:16px;padding:0 20px;border-top:0;flex-direction:row;gap:8px}
.ink{background:var(--ink);color:#FFFFFF}.ink:hover{background:var(--ink2);color:#FFFFFF}
.line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}.line:hover{box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
.soft{background:var(--sunk);color:var(--ink)}.soft:hover{background:#E0E0DC;color:var(--ink)}
.btn[aria-disabled="true"]{background:var(--rule2);color:#6B6B70;cursor:not-allowed;box-shadow:none}
.tb{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0;border:0;background:none;font:500 15px/1 var(--ft);color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:#A3A3A6;touch-action:manipulation}
.tb:hover{text-decoration-color:currentColor;color:var(--ink)}
.tb.blue{color:var(--blueT);text-decoration-color:#B9C3FF}
/* chips: radio or checkbox; selected = blue ring + tick, never colour alone */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 15px;border-radius:999px;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--edge);font:500 15px/1 var(--ft);color:var(--ink);cursor:pointer;
transition:transform .12s var(--e-ui),box-shadow .15s ease,background-color .15s ease;touch-action:manipulation}
.chip:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.chip:active{transform:scale(.97)}
.chip[aria-checked="true"],.chip[aria-pressed="true"]{background:var(--wash);color:var(--blueT);box-shadow:inset 0 0 0 1.5px var(--blue)}
/* fields */
.lbl{display:block;margin:0 0 8px;font:500 15px/1.4 var(--ft);color:var(--ink)}
.opt{font-weight:400;color:var(--mute)}
.fld{display:block;width:100%;box-sizing:border-box;min-height:48px;border:1px solid #8C8C91;border-radius:12px;padding:12px 14px;background:var(--card);font:400 16px/1.5 var(--ft);color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease}
.fld::placeholder{color:#6B6B70}
.fld:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(57,93,237,.16)}
textarea.fld{resize:vertical;min-height:112px}
.fld[aria-invalid="true"]{border-color:var(--badT);box-shadow:0 0 0 3px rgba(180,35,24,.12)}
.err{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0;font:500 14px/1.45 var(--ft);color:var(--badT)}
.rb{margin:6px 0 0;min-height:1.5em;font-size:13.5px;line-height:1.5;color:var(--mute)}
/* status pill: dot + words */
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;font:500 13px/1.4 var(--ft);white-space:nowrap;background:var(--sunk);color:var(--ink)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.pill.blue{background:var(--wash);color:var(--blueT)}.pill.blue i{background:var(--blue)}
.pill.ok{background:var(--okW);color:var(--okT)}.pill.ok i{background:var(--okD)}
.pill.warn{background:var(--warnW);color:var(--warnT)}.pill.warn i{background:var(--warnD)}
.pill.bad{background:var(--badW);color:var(--badT)}.pill.bad i{background:var(--badD)}
/* surfaces */
.card{background:var(--card);border:1px solid var(--rule2);border-radius:20px;box-sizing:border-box}
.well{background:var(--sunk);border-radius:12px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--sunk);font-size:14.5px;line-height:1.5;color:var(--ink)}
.note.blue{background:var(--wash);color:#1E2E99}
/* snackbar: what just happened + Undo; sits above the dock, never covers focus */
.snack{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:16px;min-height:48px;padding:0 8px 0 18px;border-radius:12px;background:var(--ink);color:#FFFFFF;font:500 15px/1.3 var(--ft);box-shadow:0 12px 32px rgba(17,17,17,.25);animation:snackIn .24s var(--e-in)}
.snack .tb{color:#FFFFFF;text-decoration-color:rgba(255,255,255,.5);padding:0 10px}
@keyframes snackIn{0%{opacity:0;transform:translate(-50%,8px)}}
/* loading skeleton */
.sk{border-radius:8px;background:linear-gradient(90deg,#E9E9E6 0%,#F1F1EE 50%,#E9E9E6 100%);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
/* spinner */
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;box-sizing:border-box;border:1.5px solid #D0D0CB;border-top-color:var(--blue);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
p a{padding-block:10px;margin-block:-10px}
@media (prefers-reduced-motion:reduce){.pc *,.pc *::before,.pc *::after{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;transition-delay:0s !important}}
/* ==== shell: one header for every signed-in desktop screen ==== */
.abar{position:sticky;top:0;z-index:20;height:72px;background:rgba(243,243,241,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule2)}
.abar .in{max-width:1280px;height:100%;margin:0 auto;padding:0 48px;box-sizing:border-box;display:flex;align-items:center;gap:28px}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;color:var(--ink);font:600 21px/1 var(--fd);letter-spacing:-0.03em}
.brand:hover{color:var(--ink)}
.anav{display:flex;align-items:center;gap:28px;margin-left:24px}
.anav a{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--ink);font-size:15px;text-decoration:none}
.anav a:hover{text-decoration:underline;text-underline-offset:8px;text-decoration-color:#A3A3A6}
.anav a[aria-current="page"]{font-weight:500;text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:2px;text-underline-offset:8px}
.badge{display:inline-block;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:var(--blue);color:#FFFFFF;font:600 12px/18px var(--ft);text-align:center;font-variant-numeric:tabular-nums;text-decoration:none}
.aright{margin-left:auto;display:flex;align-items:center;gap:14px}
.av{width:44px;height:44px;border-radius:50%;border:0;background:#E2E2DE;color:var(--ink);font:600 14px/1 var(--ft);cursor:pointer;display:grid;place-items:center}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:8px;background:rgba(255,255,255,.16);font:500 12px/1 var(--ft)}
.wrap{max-width:1280px;margin:0 auto;padding:0 48px;box-sizing:border-box}
/* task mode (compose, review): no nav, save status, Save and close */
.tbar{position:sticky;top:0;z-index:20;height:72px;background:rgba(243,243,241,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule2)}
.tbar .in{max-width:1280px;height:100%;margin:0 auto;padding:0 48px;box-sizing:border-box;display:flex;align-items:center;gap:20px}
.ttl{font:500 17px/1 var(--fd);letter-spacing:-0.012em;color:var(--ink)}
.saved{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--okD)}
.saved.ing i{background:var(--blue);animation:pulse 1s ease-in-out infinite}
.saved.off i{background:var(--warnD)}
@keyframes pulse{50%{opacity:.35}}
/* phone shell */
.ph{width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--paper)}
.ptop{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(52px,env(safe-area-inset-top)) 20px 10px}
.pscroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 20px 24px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 6px max(28px,calc(env(safe-area-inset-bottom) + 8px));background:#FFFFFF;border-top:1px solid var(--rule2)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:48px;justify-content:flex-end;text-decoration:none;color:#5F5F64;font:500 12px/1 var(--ft)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-8px;width:20px;height:3px;border-radius:2px;background:var(--blue)}
.tab .badge{position:absolute;top:-4px;left:calc(50% + 6px)}
.tab.share{color:var(--ink)}
.tab.share span.t{display:grid;place-items:center;width:52px;height:52px;margin-top:-22px;border-radius:20px;background:var(--ink);color:#FFFFFF;box-shadow:0 8px 20px rgba(17,17,17,.22)}
.dock{flex:none;padding:12px max(20px,env(safe-area-inset-right)) max(30px,calc(env(safe-area-inset-bottom) + 12px)) max(20px,env(safe-area-inset-left));background:var(--paper);border-top:1px solid var(--rule2);display:flex;flex-direction:column;gap:8px}
.pbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(50px,env(safe-area-inset-top)) 12px 8px 8px}
/* ==== end kit ==== */
/* ==== phone polish v1: append after the kit and before board rules on every Phone*.dc.html ==== */
html{scrollbar-gutter:auto}
body{overflow:hidden}
.ph{font-size:15px}
/* tab bar: flush, translucent, nothing pokes into content */
.tabs{align-items:stretch;padding:6px 6px max(24px,calc(env(safe-area-inset-bottom) + 4px));background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--rule2);box-shadow:none}
.tab{justify-content:flex-end;gap:4px;min-height:52px;color:#5F5F64;font:500 11.5px/1 var(--ft);letter-spacing:.01em;-webkit-tap-highlight-color:transparent}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"] svg{stroke-width:2.2}
.tab[aria-current="page"]::before{content:none}
.tab[aria-current="page"]::after{content:"";position:absolute;bottom:-3px;width:4px;height:4px;border-radius:50%;background:var(--blue)}
.tab .badge{top:2px;left:calc(50% + 5px);box-shadow:0 0 0 2px #FFFFFF}
.tab.share span.t{width:46px;height:32px;margin:0;border-radius:12px;box-shadow:none;transition:transform .12s var(--e-ui)}
.tab.share span.t svg{width:20px;height:20px}
.tab.share:active span.t{transform:scale(.94)}
/* root screens: brand row, then one large title */
.ptop{padding:max(52px,env(safe-area-inset-top)) 20px 4px;min-height:44px}
.ptop .brand{font-size:18px}
.ptop .av{width:36px;height:36px;font-size:13px}
:where(.ph) .d1,:where(.ph) .ttl-lg{font:500 32px/1.08 var(--fd);letter-spacing:-0.03em;margin:0}
:where(.ph) .h1{font:500 28px/1.12 var(--fd);letter-spacing:-0.026em}
:where(.ph) .h2{font:500 21px/1.2 var(--fd);letter-spacing:-0.018em}
:where(.ph) .h3{font:500 17px/1.3 var(--fd);letter-spacing:-0.01em}
:where(.ph) .lead{font-size:16px;line-height:1.5}
:where(.ph) .meta{font-size:13px}
/* child screens: one compact bar with Back, never a brand row plus a back link */
.pnav{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:max(48px,env(safe-area-inset-top)) 8px 6px;min-height:44px;background:var(--paper)}
.pback{display:inline-flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 8px 0 4px;color:var(--ink);font:500 16px/1 var(--ft);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pback svg{flex:none;width:22px;height:22px}
.pnav-t{font:600 15px/1.2 var(--ft);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;text-align:center}
.pnav-r{justify-self:end;display:flex;gap:4px}
.ibtn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--ink);cursor:pointer}
.ibtn:active{background:var(--sunk)}
/* rhythm */
.pscroll{padding:0 20px 32px;scroll-padding-bottom:24px}
:where(.ph) .card{border-radius:20px}
:where(.ph) .sec{margin-top:32px}
/* horizontal chip rows: edge to edge, snap, a soft fade says there is more */
.hscroll{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scroll-padding-inline:20px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none;scroll-snap-align:start}
/* list rows */
:where(.prow){display:flex;align-items:center;gap:12px;min-height:56px;padding:14px 0;border-bottom:1px solid var(--rule2);text-decoration:none;color:var(--ink)}
:where(.prow):active{background:linear-gradient(var(--sunk),var(--sunk)) no-repeat;background-size:calc(100% + 40px) 100%;background-position:-20px 0}
/* bottom docks */
.dock{background:rgba(243,243,241,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
/* ==== end phone polish ==== */
/* ---- My ideas ---- */
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.chip .n{min-width:20px;padding:2px 6px;box-sizing:border-box;border-radius:999px;background:var(--sunk);font:500 12.5px/1.3 var(--ft);color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.chip.zero .n{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
.chip[aria-pressed="true"] .n{background:#FFFFFF;color:var(--blueT);box-shadow:none}
.chip{white-space:nowrap}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunk)}
.seg button{min-height:40px;padding:0 12px;border:0;border-radius:8px;background:none;font:500 14px/1 var(--ft);color:var(--mute2);cursor:pointer;touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.seg button{position:relative}
.seg button::after{content:"";position:absolute;inset:-2px 0}
.addr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:14px 0 0;font-size:13.5px;color:var(--mute)}
.addr code{font:500 13.5px/1.4 var(--ft);color:var(--ink2);font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;gap:8px;margin:18px 0 0;padding:8px 12px;border-radius:12px;background:var(--wash);color:#1E2E99;font-size:14.5px;animation:fadeOut 4s ease 3s forwards}
@keyframes fadeOut{to{background:transparent}}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.irow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.9fr) minmax(0,1.3fr);gap:20px 28px;padding:22px 0;border-bottom:1px solid var(--rule);align-items:start}
.irow.hd{padding:12px 0;border-bottom:1px solid var(--rule)}
.irow.hd p{margin:0;font-size:13.5px;color:var(--mute)}
.irow h3 a{text-decoration:none}.irow h3 a:hover{text-decoration:underline;text-underline-offset:4px}
.irow.hl{animation:hl 1.2s ease .2s both}
@keyframes hl{0%{background:var(--wash)}100%{background:transparent}}
.mt{display:flex;gap:3px;margin-top:10px}
.ms{width:22px;height:4px;border-radius:2px;background:var(--rule)}
.ms.d{background:var(--ink)}.ms.n{background:var(--blue)}.ms.x{background:none;box-shadow:inset 0 0 0 1px #B8B8B3}
.nx{margin:0;font-size:15px;line-height:1.5;color:var(--ink)}
.skrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.9fr) minmax(0,1.3fr);gap:28px;padding:26px 0;border-bottom:1px solid var(--rule)}
.emptyc{padding:44px 40px 46px;text-align:left}
.none{padding:40px 0 44px;border-bottom:1px solid var(--rule)}
.ph .hscroll{margin-top:16px}
/* once scrolled, the row fades at both ends so a cut-off chip always reads as "more this way" */
.hscroll.lfade{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28px,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 28px,#000 calc(100% - 32px),transparent)}
.prow{align-items:center;padding:16px 0}
.prow:hover{color:var(--ink)}
.prow .pcol{flex:1;min-width:0}
.prow .top{display:flex;align-items:center;gap:12px;margin-top:8px}
.prow .nx{margin:8px 0 0;font-size:14px;line-height:1.45;color:var(--mute2)}
.prow .chev{flex:none;color:#6C6C70}
.ph .back{margin-top:12px}
.prow .go{display:inline-block;margin-top:6px;font:500 14px/1.3 var(--ft);color:var(--ink)}
.prow.hl{animation:hl 1.2s ease .2s both}
.ph .back{margin-top:12px;font-size:13.5px}
.ph .emptyc{padding:28px 22px}
/* avatar: a Google-style outer ring in the tier's colours, a white gap, then the face */

.av.t1,.av.t2,.av.t3,.av.t4,.av.t5,.av.t6,.av.t7{box-sizing:border-box;border:3px solid transparent;background:linear-gradient(#ECECE8,#ECECE8) padding-box,var(--ring) border-box;box-shadow:inset 0 0 0 2px #FFFFFF}
/* ==== phone Inbox ==== */
.ibh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:8px}
.ibh .tb{font-size:14.5px;margin-bottom:4px}
.ichips{margin-top:14px}

.igh{margin:22px 0 4px;font:500 13px/1.3 var(--ft);color:var(--mute)}

.irow .av.ink{background:var(--ink);color:#FFFFFF}
.ib{display:flex;flex-direction:column;gap:3px;min-width:0}
.ia{font-size:15px;line-height:1.35;color:var(--ink2)}

/* ==== one look on every screen: ambient light, glass, colour ==== */
.pc{position:relative;isolation:isolate;min-height:100vh;--card:rgba(255,255,255,.78)}
.amb{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.amb i{position:absolute;border-radius:50%}
.pc .glow,.pc .pglow{display:none !important}
:where(.card,.panel){-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 18px 40px -30px rgba(17,17,17,.28)}
:where(.card,.panel){border-color:rgba(17,17,17,.07)}

.ph{isolation:isolate}
.amb i{filter:blur(30px)}
.amb .a1{width:380px;height:330px;left:-120px;top:-50px;background:radial-gradient(closest-side,rgba(57,93,237,0.34),rgba(57,93,237,0))}
.amb .a2{width:350px;height:310px;right:-130px;top:290px;background:radial-gradient(closest-side,rgba(244,104,53,0.24),rgba(244,104,53,0))}
.amb .a3{width:420px;height:330px;left:-70px;top:600px;background:radial-gradient(closest-side,rgba(146,128,255,0.3),rgba(146,128,255,0))}

.tabs{background:rgba(255,255,255,.72)}
.dock{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
/* ==== R29 colour roles (begin) ==== */
/* warm colour means "needs you": avatar rings are neutral here; tier colour lives on Profile, the Wall, the One dashboard and the Ones */
/* your own profile icon keeps its tier ring: the side bar on desktop, the account button on the phone */
:is(.pc,.ph) :is(.t1,.t2,.t3,.t4,.t5,.t6,.t7):not(.ocard):not(.ocard *):not(.sb-me *):not([aria-label^="Your account"]){--ring:linear-gradient(#D9D9DE,#D9D9DE)}
/* a task screen: quiet light, the cool glow at half strength, no warm or violet glow */
.amb .a2,.amb .a3,.amb .a5,.amb .a6{display:none}
.amb .a1,.amb .a4{opacity:.5}
/* ==== R29 colour roles (end) ==== */
/* ==== R37 field messages (begin) ==== */
/* no snackbars: the screen itself shows what changed. A field's error or warning sits right under that field:
   a soft tinted note, a round icon, a short drop-in */
:is(.err,.caperr,.cerr):is(p,div,span){position:relative;display:flex;align-items:flex-start;gap:8px;width:fit-content;max-width:100%;box-sizing:border-box;margin:8px 0 0;padding:7px 12px 7px 9px;border-radius:12px;font:500 13.5px/1.45 var(--ft);animation:fmIn .28s cubic-bezier(.2,.7,.2,1) both}
:is(.err,.cerr):is(p,div,span){background:var(--badW);color:var(--badT);box-shadow:inset 0 0 0 1px rgba(180,35,24,.14)}
.caperr:is(p,div,span){background:var(--warnW);color:var(--warnT);box-shadow:inset 0 0 0 1px rgba(181,71,8,.16)}
:is(.err,.caperr,.cerr)>svg{flex:none;width:16px;height:16px;margin-top:1px}
:is(.err,.cerr):not(:has(>svg))::before,.caperr:not(:has(>svg))::before{content:"!";flex:none;display:grid;place-items:center;width:16px;height:16px;margin-top:1px;border-radius:50%;font:700 11px/1 var(--ft);color:#FFFFFF}
:is(.err,.cerr):not(:has(>svg))::before{background:var(--badT)}
.caperr:not(:has(>svg))::before{background:var(--warnT)}
.blkn:is(p,div){border-radius:12px;background:var(--warnW);box-shadow:inset 0 0 0 1px rgba(181,71,8,.16);font-size:13.5px;animation:fmIn .28s cubic-bezier(.2,.7,.2,1) both}
.sorterr{margin-top:10px}
