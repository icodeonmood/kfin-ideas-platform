<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111111}
.rb{width:56px;height:56px;border-radius:50%;border:0;background:transparent;color:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.rb:hover{box-shadow:inset 0 0 0 1px #FFFFFF}
.rb:focus-visible{outline:2px solid #8FA8FF;outline-offset:3px}
.star{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.twinkle{animation:tw 4.8s ease-in-out infinite;animation-delay:calc(var(--d) * -1s)}
@keyframes tw{50%{opacity:.5}}
.lit{animation:lit 1.4s cubic-bezier(.16,1,.3,1) both}
@keyframes lit{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.halo{position:absolute;left:50%;top:50%;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.7);transition:opacity .6s ease}
.bub{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:rgba(26,26,30,.9);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 8px 24px rgba(0,0,0,.35);font:500 15px/1.2 var(--ft);color:#FFFFFF;white-space:nowrap;transition:background-color .5s ease,color .5s ease}
.bub::before{content:"";position:absolute;left:50%;top:-6px;margin-left:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid rgba(26,26,30,.9)}
.bub.on{background:#FFFFFF;color:#111111;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.bub.on::before{border-bottom-color:#FFFFFF}
.bdot{width:8px;height:8px;border-radius:50%;flex:none}
.haloA,.haloB{animation:haloIn 1.2s cubic-bezier(.16,1,.3,1) both}
.haloB{animation-name:haloIn2}
@keyframes haloIn{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes haloIn2{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
/* the OFFER build: frame, structure, colour, words, numbers */
.bA,.bB{animation:frameA 1.8s cubic-bezier(.16,1,.3,1) both}.bB{animation-name:frameB}
@keyframes frameA{0%{opacity:0;transform:scale(.97);box-shadow:inset 0 0 0 1.5px rgba(143,168,255,.85);background-color:rgba(51,85,255,.06)}22%{opacity:1;transform:none}60%{box-shadow:inset 0 0 0 1.5px rgba(143,168,255,.35);background-color:rgba(20,20,24,.2)}100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);background-color:rgba(20,20,24,.92)}}
@keyframes frameB{0%{opacity:0;transform:scale(.97);box-shadow:inset 0 0 0 1.5px rgba(143,168,255,.85);background-color:rgba(51,85,255,.06)}22%{opacity:1;transform:none}60%{box-shadow:inset 0 0 0 1.5px rgba(143,168,255,.35);background-color:rgba(20,20,24,.2)}100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);background-color:rgba(20,20,24,.92)}}
.bA .wd,.bB .wd{display:inline-block;animation:wordA 2.6s linear both;animation-delay:calc(var(--base,0ms) + var(--j,0) * 45ms)}.bB .wd{animation-name:wordB}
@keyframes wordA{0%,48%{color:transparent;text-decoration:underline;text-decoration-thickness:.62em;text-underline-offset:-.72em;text-decoration-color:rgba(255,255,255,.14)}58%{color:#8FA8FF;text-decoration-color:rgba(255,255,255,0)}}
@keyframes wordB{0%,48%{color:transparent;text-decoration:underline;text-decoration-thickness:.62em;text-underline-offset:-.72em;text-decoration-color:rgba(255,255,255,.14)}58%{color:#8FA8FF;text-decoration-color:rgba(255,255,255,0)}}
.bA .fill,.bB .fill{animation:fillA 1.6s ease both;animation-delay:.45s}.bB .fill{animation-name:fillB}
@keyframes fillA{0%,40%{opacity:0;transform:scaleX(.2)}100%{opacity:1;transform:none}}
@keyframes fillB{0%,40%{opacity:0;transform:scaleX(.2)}100%{opacity:1;transform:none}}
.dg{display:inline-block;height:1em;overflow:hidden;vertical-align:top;line-height:1}
.dg .col{display:block;transition:transform 1.5s cubic-bezier(.16,1,.3,1)}
.dg .col>span{display:block;height:1em}
.bar{transform-origin:0 50%}
.runA,.runB{animation:run var(--dwell) linear both}.runB{animation-name:run2}
@keyframes run{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes run2{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.paused .runA,.paused .runB{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.twinkle,.lit,.bA,.bB,.bA *,.bB *,.haloA,.haloB,.runA,.runB{animation:none !important}.dg .col{transition:none !important}}
/* ==== motion v1 (begin) ==== */
/* ==== motion v1: one motion language for every screen (tokens, screen entrances, arrivals, components, overlays) ==== */
:root{
  --mo-press:110ms; --mo-quick:180ms; --mo-state:260ms; --mo-move:460ms; --mo-scene:720ms; --mo-hero:1000ms;
  --mo-out:cubic-bezier(.16,1,.3,1);          /* expo out: arrivals, reveals */
  --mo-emph:cubic-bezier(.05,.7,.1,1);        /* emphasised decelerate: things entering the screen */
  --mo-acc:cubic-bezier(.3,0,.8,.15);         /* emphasised accelerate: things leaving */
  --mo-snap:cubic-bezier(.2,0,0,1);           /* standard: state changes */
  --mo-spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);
  --mo-soft:linear(0,.06 4%,.24 10%,.53 18%,.79 27%,.93 35%,1.01 45%,1.03 52%,1.02 62%,1);
  --mo-base:0ms; --mo-gap:56ms;
}
@view-transition{navigation:auto}
::view-transition-old(root){animation:moVtOut .22s var(--mo-acc) both}
::view-transition-new(root){animation:moVtIn .42s var(--mo-out) both}
.sbar{view-transition-name:mo-sbar}
.ph > .tabs,.pc.ph > .tabs{view-transition-name:mo-tabs}
@keyframes moVtOut{to{opacity:0;scale:.985}}
@keyframes moVtIn{from{opacity:0;scale:1.01}}

@media (prefers-reduced-motion:no-preference){
/* --- 1. screens arrive: content blocks rise out of a soft blur, one after another; the side bar and tab bar stay still --- */
:is(.pc,.ph) > :is(main,#rv-main,#pr-main,.cz,.phm,.pbody,.pscroll,.lscroll,section.stage,header.top) > :not(.glow,.amb,.aurora,.mo-skip,.reveal),
.pc > main.left > *,.pc > aside.right > *,.pc > footer,.ph > .ptop,.ph > .pnav{
  animation:moIn var(--mo-scene) var(--mo-out) backwards;animation-delay:calc(var(--mo-base) + var(--mo-i,0) * var(--mo-gap))}
:is(main,#rv-main,#pr-main,.cz,.phm,.pbody,.pscroll,.lscroll,section.stage,header.top,main.left,aside.right) > :nth-child(2){--mo-i:1}
:is(main,#rv-main,#pr-main,.cz,.phm,.pbody,.pscroll,.lscroll,section.stage,header.top,main.left,aside.right) > :nth-child(3){--mo-i:2}
:is(main,#rv-main,#pr-main,.cz,.phm,.pbody,.pscroll,.lscroll,section.stage,header.top,main.left,aside.right) > :nth-child(4){--mo-i:3}
:is(main,#rv-main,#pr-main,.cz,.phm,.pbody,.pscroll,.lscroll,section.stage,header.top,main.left,aside.right) > :nth-child(5){--mo-i:4}
:is(main,#rv-main,#pr-main,.cz,.phm,.pbody,.pscroll,.lscroll,section.stage,header.top,main.left,aside.right) > :nth-child(6){--mo-i:5}
:is(main,#rv-main,#pr-main,.cz,.phm,.pbody,.pscroll,.lscroll,section.stage,header.top,main.left,aside.right) > :nth-child(n+7){--mo-i:6}
/* headlines settle a beat later: up from below, tracking tightening as they land */
:is(main,#rv-main,#pr-main,.cz,.phm,.pbody,.pscroll,.lscroll,section.stage,main.left,aside.right) :is(h1,.d1,.mi-t,.hello,.mh1,.mtitle):not([data-mo-split]){
  animation:moHead calc(var(--mo-scene) + 200ms) var(--mo-out) backwards;animation-delay:calc(var(--mo-base) + 90ms)}
/* static hero headlines wait for the engine's word reveal; if the engine never comes, they show on their own */
[data-mo-split]{animation:moLate .5s var(--mo-out) 1.15s backwards}
.mo-split-on [data-mo-split]{animation:none}
/* cinematic boards: longer, deeper arrivals */
.mo-cine{--mo-scene:1000ms;--mo-gap:80ms}
.mo-cine :is(.pc,.ph) > :is(main,section.stage,.lscroll,header.top) > :not(.glow,.amb,.aurora,.mo-skip,.reveal){animation-name:moInDeep}
/* arrivals from another screen, set by the engine before the first frame */
.mo-a-expand{--mo-base:380ms}
.mo-a-portal{--mo-base:420ms}
.mo-a-peer :is(.pc,.ph) > :is(main,#rv-main,#pr-main,.cz,.phm,.pbody,.pscroll,.lscroll,section.stage) > :not(.glow,.amb,.aurora,.mo-skip,.reveal){animation-name:moThrough;animation-duration:var(--mo-move);--mo-gap:30ms}
.mo-a-fwd :is(.pc,.ph) > :is(main,#rv-main,#pr-main,.cz,.phm,.pbody,.pscroll,.lscroll,section.stage) > :not(.glow,.amb,.aurora,.mo-skip,.reveal){animation-name:moAxisIn;animation-duration:var(--mo-move);--mo-gap:36ms}
.mo-a-back :is(.pc,.ph) > :is(main,#rv-main,#pr-main,.cz,.phm,.pbody,.pscroll,.lscroll,section.stage) > :not(.glow,.amb,.aurora,.mo-skip,.reveal){animation-name:moAxisBack;animation-duration:var(--mo-move);--mo-gap:36ms}

/* --- 2. controls --- */
.btn,.chip,.mtab,.mtb,.sb-i,.sb-new,.tab,.irow,.opt2,.tb,.mic,.icb,.copy{transition-property:transform,background-color,box-shadow,color,opacity,text-decoration-color;transition-timing-function:var(--mo-snap);transition-duration:var(--mo-state)}
.btn.ink,.sb-new,.fab{background-image:linear-gradient(115deg,transparent 0 38%,rgba(255,255,255,.2) 50%,transparent 62% 100%);background-size:260% 100%;background-position:120% 0;background-repeat:no-repeat;transition:background-position .9s var(--mo-out),background-color var(--mo-state) var(--mo-snap),box-shadow var(--mo-state) var(--mo-snap),transform var(--mo-state) var(--mo-snap)}
.btn.ink:hover,.sb-new:hover,.fab:hover{background-position:-20% 0;box-shadow:0 14px 30px -14px rgba(17,17,17,.6)}
.btn.ink[aria-disabled="true"]:hover{background-position:120% 0;box-shadow:none}
.btn.line:hover{box-shadow:inset 0 0 0 1px var(--ink),0 10px 22px -16px rgba(17,17,17,.45)}
:is(a,button,input,textarea,summary,[tabindex]):focus-visible{transition:outline-offset var(--mo-quick) var(--mo-out)}
.chip[aria-pressed="true"],.chip[aria-checked="true"],[role="radio"][aria-checked="true"],[role="checkbox"][aria-checked="true"]{transition-timing-function:var(--mo-spring);transition-duration:520ms}
.mo-js .btn:active,.mo-js .chip:active{transform:none}

/* --- 3. things that open: menus, pop-ups, sheets, banners, notes --- */
:is(.mback,.backdrop,.scrim){animation:moFade var(--mo-state) var(--mo-out) backwards}
:is(.mbox,.dialog,[role="dialog"]:not(.mwrap)){animation:moModal 520ms var(--mo-spring) backwards}
.ph :is(.mbox,.sheet,.bsheet,.psheet){animation:moSheet 560ms var(--mo-emph) backwards}
:is(.lmpop,.qmenu,.ipop,.pop,[role="menu"],[role="listbox"]){transform-origin:top right;animation:moMenu 260ms var(--mo-out) backwards}
:is(.snack){animation:moToast 560ms var(--mo-spring) backwards}
:is(.confirm,.banner,.note,.okline,.jdone,.ctray,.vq,.verq,.upd){animation:moUnfold 420ms var(--mo-out) backwards}
:is(.err,.cerr,.alert,[role="alert"]){animation:moNudge 480ms var(--mo-out) backwards}
.otp.bad{animation:moShake 420ms var(--mo-snap)}
details > :not(summary){animation:moUnfold 380ms var(--mo-out) backwards}
:root{interpolate-size:allow-keywords}
/* --- 4. progress: the track draws itself and each step lands in turn; "now" breathes twice --- */
.trk::after{animation:moGrowW 1.2s var(--mo-out) backwards;animation-delay:calc(var(--mo-base) + 420ms)}
.trk > li :is(.nd){animation:moPop 700ms var(--mo-spring) backwards;animation-delay:calc(var(--mo-base) + 300ms + var(--mo-k,0) * 120ms)}
.trk > li:nth-child(2){--mo-k:1}.trk > li:nth-child(3){--mo-k:2}.trk > li:nth-child(4){--mo-k:3}.trk > li:nth-child(5){--mo-k:4}.trk > li:nth-child(6){--mo-k:5}
.st.now .nd{animation:moPop 700ms var(--mo-spring) backwards,moBreath 2.2s var(--mo-out) 1.8s 2;animation-delay:calc(var(--mo-base) + 300ms + var(--mo-k,0) * 120ms),calc(var(--mo-base) + 1.8s)}
.vtrk .st::before{transform-origin:top;animation:moGrowY 900ms var(--mo-out) backwards;animation-delay:calc(var(--mo-base) + 300ms + var(--mo-k,0) * 120ms)}
.vtrk > li:nth-child(2){--mo-k:1}.vtrk > li:nth-child(3){--mo-k:2}.vtrk > li:nth-child(4){--mo-k:3}.vtrk > li:nth-child(5){--mo-k:4}
:is(.pvwrap) > :is(.pvback){animation:moFade var(--mo-state) var(--mo-out) backwards}
:is(.pvwrap) > :is(.pvm){animation:moModal 520ms var(--mo-spring) backwards}
.ph .pvwrap > .pvm{animation:moSheet 560ms var(--mo-emph) backwards}
details::details-content{transition:height 380ms var(--mo-out),content-visibility 380ms allow-discrete;height:0;overflow:clip}
details[open]::details-content{height:auto}
}

/* engine-only rules */
.mo-js :is(.btn.ink,.sb-new,.fab){transition-property:background-position,background-color,box-shadow,transform,translate;transition-duration:.9s,var(--mo-state),var(--mo-state),var(--mo-state),.55s;transition-timing-function:var(--mo-out),var(--mo-snap),var(--mo-snap),var(--mo-snap),var(--mo-out)}
.mo-leaving,.mo-leaving *{animation:none !important;pointer-events:none !important}
.mo-flipping :is(.qrow,.irow,.irow2,.jcard,.card,.pcard,.wcard,.tile,.chip,.opt2,.mtab,.mtb,.isec,.btn,li){transition-duration:0s !important}
.amb i,.aurora i{translate:0 var(--mo-py,0px)}
.mo-a-expand :is(main,#rv-main,#pr-main,.cz,.phm,.pbody,.pscroll,.lscroll,section.stage) :is(h1,.mtitle,.h1,.mi-t,.hello){animation:none}
.mo-w{display:inline-block;will-change:transform}

/* the layer the engine draws arrivals, sparks and selection rings on (outside the board's own DOM) */
#mo-fx{position:fixed;inset:0;z-index:2147483000;pointer-events:none;contain:strict}
#mo-fx > *{position:absolute;pointer-events:none}
.mo-ghost{left:0;top:0;right:0;bottom:0;will-change:clip-path,opacity}
.mo-ghost-t{margin:0;white-space:nowrap;transform-origin:0 0;will-change:transform,opacity}
.mo-ring{border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--blue,#3355FF);will-change:transform,width,height}
.mo-spark{width:5px;height:14px;border-radius:3px;left:0;top:0;will-change:transform,opacity}
.mo-wave{left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;box-shadow:0 0 0 2px rgba(51,85,255,.55)}
.mo-leaving{pointer-events:none !important}

@keyframes moGrowW{from{width:0}}
@keyframes moGrowY{from{scale:1 0}}
@keyframes moPop{0%{opacity:0;scale:.4}60%{opacity:1}100%{scale:1}}
@keyframes moBreath{0%{box-shadow:inset 0 0 0 2px var(--blue,#3355FF),0 0 0 4px rgba(51,85,255,.16)}50%{box-shadow:inset 0 0 0 2px var(--blue,#3355FF),0 0 0 12px rgba(51,85,255,0)}100%{box-shadow:inset 0 0 0 2px var(--blue,#3355FF),0 0 0 4px rgba(51,85,255,.16)}}
@keyframes moIn{from{opacity:0;translate:0 22px;scale:.985;filter:blur(6px)}}
@keyframes moInDeep{from{opacity:0;translate:0 48px;scale:.96;filter:blur(14px)}}
@keyframes moHead{from{opacity:0;translate:0 .45em;filter:blur(8px);letter-spacing:.02em}}
@keyframes moLate{from{opacity:0;translate:0 .3em}}
@keyframes moThrough{from{opacity:0;scale:.975}}
@keyframes moAxisIn{from{opacity:0;translate:48px 0}}
@keyframes moAxisBack{from{opacity:0;translate:-48px 0}}
@keyframes moFade{from{opacity:0}}
@keyframes moModal{from{opacity:0;translate:0 18px;scale:.94;filter:blur(6px)}}
@keyframes moSheet{from{translate:0 100%}}
@keyframes moMenu{from{opacity:0;translate:0 -6px;scale:.95;filter:blur(4px)}}
@keyframes moToast{from{opacity:0;translate:0 24px;scale:.92}}
@keyframes moUnfold{from{opacity:0;translate:0 -6px;clip-path:inset(0 0 100% 0 round 14px)}}
@keyframes moNudge{0%{opacity:0;translate:0 -4px}35%{opacity:1;translate:-5px 0}55%{translate:4px 0}75%{translate:-2px 0}100%{translate:0 0}}
@keyframes moShake{20%{translate:-8px 0}40%{translate:7px 0}60%{translate:-4px 0}80%{translate:2px 0}}
@media (prefers-reduced-motion:reduce){#mo-fx{display:none}[data-mo-split]{animation:none}}
/* ==== motion v1 (end) ==== */
</style>
</helmet>
<div role="region" aria-label="The Ones, in the sky" class="{{pausedCls}}" style="--fd: 'Inter Tight', Inter, system-ui, sans-serif; --ft: Inter, system-ui, sans-serif; --dwell: {{dwell}}; width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #111111; color: #FFFFFF; font-family: var(--ft)">
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(60% 55% at 70% 40%, rgba(51,85,255,.12), rgba(51,85,255,0)), radial-gradient(40% 40% at 20% 85%, {{f.glowSoft}}, rgba(0,0,0,0))"></div>
<div aria-hidden="true" style="position: absolute; inset: 0">
<sc-for list="{{dust}}" as="d" hint-placeholder-count="40"><span class="star twinkle" style="left: {{d.x}}%; top: {{d.y}}%; width: {{d.s}}px; height: {{d.s}}px; background: rgba(255,255,255,{{d.a}}); --d: {{d.t}}"></span></sc-for>
</div>
<ul aria-label="The Ones" style="list-style: none; margin: 0; padding: 0; position: absolute; inset: 0">
<sc-for list="{{ones}}" as="o" hint-placeholder-count="7">
<li class="star lit" style="left: {{o.x}}%; top: {{o.y}}%; width: {{o.box}}px; height: {{o.box}}px; opacity: {{o.op}}; animation-delay: {{o.delay}}">
<sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" class="halo {{haloCls}}" style="width: {{o.halo}}px; height: {{o.halo}}px; margin: {{o.haloM}}"></span></sc-if>
<sc-if value="{{dots}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: {{o.colour}}; box-shadow: 0 0 {{o.g}}px {{o.colour}}, 0 0 4px #FFFFFF"></span></sc-if>
<sc-if value="{{sparks}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" viewBox="0 0 100 100" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 {{o.glow}}px {{o.colour}})"><polygon points="{{o.pts}}" fill="{{o.colour}}"></polygon><circle cx="{{o.ex}}" cy="{{o.ey}}" r="3.5" fill="{{o.colour}}"></circle></svg></sc-if>
<span class="bub {{o.bubCls}}"><span aria-hidden="true" class="bdot" style="background: {{o.colour}}"></span>No. {{o.no}} · {{o.first}}</span>
</li>
</sc-for>
</ul>

<div style="position: absolute; left: 96px; top: 84px; right: 96px; display: flex; justify-content: space-between; align-items: flex-start">
<div>
<p style="margin: 0; font: 500 15px/1.2 var(--ft); letter-spacing: .12em; text-transform: uppercase; color: #C4C4C7">1% Club · KFintech</p>
<h1 style="margin: 22px 0 0; font-family: var(--fd); font-weight: 500; letter-spacing: -0.03em; font-size: 168px; line-height: .92">The Ones</h1>
<p style="margin: 18px 0 0; font-size: 22px; color: #C4C4C7">{{count}} Ones so far. Each one shipped something that changed how we work.</p>
</div>
<div style="display: flex; gap: 14px">
<button type="button" class="rb" aria-label="{{pauseLabel}}" onClick="{{togglePause}}"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{pauseIcon}}"></path></svg></button>
<button type="button" class="rb" aria-label="Full screen"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V4h4M12 4h4v4M16 12v4h-4M8 16H4v-4"></path></svg></button>
</div>
</div>

<article aria-live="off" class="{{buildCls}}" style="position: absolute; left: 96px; bottom: 88px; width: 680px; border-radius: 24px; padding: 36px 40px 30px; box-sizing: border-box; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.5)">
<div aria-hidden="true" class="fill" style="position: absolute; inset: -50% 10% 40% -30%; background: radial-gradient(closest-side, {{f.glowA}}, {{f.glowB}})"></div>
<div style="position: relative">
