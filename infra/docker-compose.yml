# Local stack for The Garage · Ideas. Synthetic data only.
# Run through the Makefile (`make up`), which sets the project directory to the repo root and loads `.env`.
# Host ports and the project name can be overridden from `.env` for a second stack (BLD-200); the defaults are
# the ports below.
name: kfin-ideas

x-db-url: &db_url postgres://ideas:ideas@postgres:5432/ideas?sslmode=disable
# Each service connects as its own role (BLD-077); dbmate keeps the owner for migrations.
x-db-worker-url: &db_worker_url postgres://ideas_worker:dev-worker-only@postgres:5432/ideas?sslmode=disable
x-db-web-url: &db_web_url postgres://ideas_web:dev-web-only@postgres:5432/ideas?sslmode=disable

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: ideas
      POSTGRES_PASSWORD: ideas
      POSTGRES_DB: ideas
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideas -d ideas"]
      interval: 3s
      timeout: 3s
      retries: 30

  # S3-compatible file store. MinIO no longer publishes public images (BLD-017); Versity S3 Gateway
  # speaks the same S3 API. Buckets are created by the worker on start (`attachments.store.ensure_buckets`).
  s3:
    image: versity/versitygw:v1.10.0
    command: ["--port", ":9000", "--health", "/health", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:-minio-secret}
    ports: ["${S3_HOST_PORT:-9000}:9000"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  clamav:
    image: clamav/clamav-debian:1.4   # the Alpine image has no arm64 build
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"   # dev: use the signatures baked into the image; no outbound updates
    # Run clamd itself as the container's main process (the image's /init execs clamd when the first
    # argument starts with "-"), so if the small dev VM's OOM killer takes clamd the container exits
    # and Docker restarts it, instead of staying "Up (unhealthy)" with no scanner.
    command: ["--foreground"]
    restart: unless-stopped
    ports: ["${CLAMAV_HOST_PORT:-3310}:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
    ports: ["${MOCK_OIDC_PORT:-8090}:8080"]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["${MAILPIT_SMTP_HOST_PORT:-1025}:1025", "${MAILPIT_UI_HOST_PORT:-8025}:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *db_worker_url
      COMPANY_REPO_PATH: /data/kfin-ideas
      S3_ENDPOINT: http://s3:9000
      # A second stack on a small dev VM may borrow another stack's scanner (BLD-200):
      # WORKER_CLAMAV_HOST=host.docker.internal and that stack's published port.
      CLAMAV_HOST: ${WORKER_CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${WORKER_CLAMAV_PORT:-3310}
      SMTP_URL: smtp://mailpit:1025
      WORKER_ROLES: api,repo_writer,indexer,jobs,scheduler,ticker
      # Shared with the speech service only, never the web app (BLD-C015). Dev value; UAT and prod set their own.
      SPEECH_SERVICE_TOKEN: ${SPEECH_SERVICE_TOKEN:-dev-speech-service-token-0000000}
    # On a Linux host the bind-mounted ./.data keeps host file owners, so CI runs the worker as the host user
    # (WORKER_UID/WORKER_GID in .env) to share the company repo with the host-side seed and tests. The image's
    # own user (10001) is the default; Docker Desktop and Colima map owners, so Macs need nothing.
    user: "${WORKER_UID:-10001}:${WORKER_GID:-10001}"
    volumes: ["./.data:/data"]
    ports: ["${WORKER_HOST_PORT:-8000}:8000"]
    # `speech` is the internal network the worker shares with the isolated speech service only (BLD-C015).
    networks: [default, speech]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/internal/health',timeout=2).status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *db_web_url
      WORKER_URL: http://worker:8000
      # Dev only: the server reaches the mock IdP inside Docker; the browser uses OIDC_ISSUER (BLD-042).
      OIDC_INTERNAL_BASE: http://mock-oidc:8080
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports: ["${WEB_HOST_PORT:-3000}:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # The isolated speech service for voice notes (DEC-096, BLD-C015). Not started by `make up`: run it with
  # `COMPOSE_PROFILES=speech make up` and set SPEECH_ENGINE_URL=http://speech:8300 for the worker. Outside dev and
  # test the worker refuses to transcribe without it (BLD-C012). It holds only the speech engine; a decoder exploit
  # inside it reaches no secret of the platform and no network but the worker's.
  speech:
    profiles: [speech]
    build:
      context: .
      dockerfile: services/worker/speech_service/Dockerfile
    user: "10002:10002"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: ${SPEECH_MEM_LIMIT:-3g}
    # No env_file: nothing from .env reaches it. Only these, and the token is the service's own.
    environment:
      SPEECH_ENGINE: ${SPEECH_SERVICE_ENGINE:-faster-whisper}
      SPEECH_MODEL_PATH: /models
      SPEECH_THREADS: ${SPEECH_THREADS:-2}
      SPEECH_MEMORY_MB: ${SPEECH_MEMORY_MB:-2560}
      SPEECH_TIMEOUT_S: ${SPEECH_TIMEOUT_S:-300}
      SPEECH_SERVICE_TOKEN: ${SPEECH_SERVICE_TOKEN:-dev-speech-service-token-0000000}
    volumes: ["${SPEECH_MODEL_DIR:-./.models/speech}:/models:ro"]
    networks: [speech]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8300/health',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  # One-shot tool, not part of `make up`: `make migrate` runs it.
  dbmate:
    image: ghcr.io/amacneil/dbmate:2.28
    profiles: [tools]
    environment:
      DATABASE_URL: *db_url
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
    volumes: ["./db:/db:ro"]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  default: {}
  # Internal: no route out, not to the internet and not to the other networks (BLD-C015).
  speech:
    internal: true

volumes:
  pgdata:
  s3data:
