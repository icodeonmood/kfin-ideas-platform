# UAT-shaped stack (AT-B7-06), layered over infra/docker-compose.yml by scripts/uat/deploy.sh. Synthetic data only.
#
# Differences from dev: its own project name and volumes (dev data is never touched); APP_ENV and every secret come
# from the UAT env files, never `.env`; each service connects with its own password; only the web app is
# published; no mock sign-in (Entra in UAT); dev-only settings cleared. KFin's own S3, scanner and mail service
# replace s3, clamav and mailpit on the UAT host by setting S3_ENDPOINT, CLAMAV_HOST and EMAIL_MODE=graph.
name: kfin-ideas-uat

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the database env file}
    ports: !reset []
    volumes: !override [uat_pgdata:/var/lib/postgresql/data]

  s3:   # a local stand-in, used only when S3_ENDPOINT points at it (the rehearsal)
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in the app env file}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in the app env file}
    ports: !reset []
    volumes: !override [uat_s3data:/data]

  clamav:
    ports: !reset []

  mailpit:
    ports: !reset []

  mock-oidc:
    profiles: [dev-only]   # never started here

  worker:
    env_file: !override
      - path: ${UAT_APP_ENV_FILE:?set UAT_APP_ENV_FILE}
    environment:
      DATABASE_URL: postgres://ideas_worker:${DB_WORKER_PASSWORD:?set DB_WORKER_PASSWORD}@postgres:5432/ideas?sslmode=disable
      # The pseudonym vault's own key, from the database (worker-only) env file: the web app never gets it.
      PSEUDONYM_VAULT_KEY: ${PSEUDONYM_VAULT_KEY:?set PSEUDONYM_VAULT_KEY in the database env file}
      # The base file points these at the local stand-ins; in UAT they come from the app env file, required.
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in the app env file}
      CLAMAV_HOST: ${CLAMAV_HOST:?set CLAMAV_HOST in the app env file}
      SMTP_URL: ${SMTP_URL:-}
      EVAL_REPORTS_DIR: /data/eval-reports   # kept between deploys: the regression check's baseline
      # From the database env file: the worker and the speech service only (BLD-C015). Empty when voice is not used.
      SPEECH_SERVICE_TOKEN: ${SPEECH_SERVICE_TOKEN:-}
    volumes: !override ["${UAT_DATA_DIR:?set UAT_DATA_DIR}:/data"]
    ports: !reset []

  web:
    env_file: !override
      - path: ${UAT_APP_ENV_FILE}
    environment:
      DATABASE_URL: postgres://ideas_web:${DB_WEB_PASSWORD:?set DB_WEB_PASSWORD}@postgres:5432/ideas?sslmode=disable
      OIDC_INTERNAL_BASE: ""   # dev only; the web app refuses it outside dev
    ports: !override ["${UAT_WEB_PORT:-3100}:3000"]

  # The isolated speech service (BLD-C015), started only when SPEECH_ENGINE_URL is set (deploy.sh adds the profile).
  # An empty token makes it refuse to start: it fails closed.
  speech:
    environment:
      SPEECH_SERVICE_TOKEN: ${SPEECH_SERVICE_TOKEN:-}
    volumes: !override ["${SPEECH_MODEL_DIR:-/srv/kfin-speech-models}:/models:ro"]

  dbmate:
    environment:
      DATABASE_URL: postgres://ideas:${POSTGRES_PASSWORD}@postgres:5432/ideas?sslmode=disable

volumes:
  uat_pgdata:
  uat_s3data:
