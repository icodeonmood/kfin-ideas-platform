# CI for kfin-ideas-platform. The Makefile is the contract; this file only calls it, so the same gates can
# move to KFin's own CI (GitLab, Azure DevOps) unchanged when IT provides the internal repo (BLD-026).
# Synthetic data only. No secrets are needed: LLM_MODE=fake, EMBEDDINGS_MODE=hash, OIDC_MODE=mock.
name: ci

# Every code push to main and every pull request runs the full gates (DEC-093, BLD-159); a newer push cancels the
# run still going for the same branch, and pushes that change only docs skip it. Also by hand (Run workflow).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]  # docs and top-level notes only; seed and agent Markdown still run it
  pull_request:
    paths-ignore: ["docs/**", "*.md"]  # docs and top-level notes only; seed and agent Markdown still run it
  workflow_dispatch:

concurrency:
  # On main every commit gets its own check, so a new push never cancels the one already running (BLD-A184:
  # 5 of 25 main runs were cancelled on 16 Nov). Other branches keep only their latest run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The journey suite is a gate too (BLD-A230; the Thu 19 Nov 14:00 gates in SHIP_PLAN_1PC.md, added from 09:30 at
  # lane G's ask): every run off main walks every journey (apps/web/journeys) on its own runner, beside the gates,
  # with no retries. On main the suite runs from journeys.yml's own push trigger instead, and lane G reads those runs.
  journeys:
    if: github.ref != 'refs/heads/main'
    uses: ./.github/workflows/journeys.yml

  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd services/worker && uv sync --frozen
          cd ../../apps/web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      # Lane D's QA branch only (d/qa-nowrap-phone-1, never merged): the QA spec is hand-written, so format it first
      - name: Lane D QA format
        run: cd apps/web && npx prettier --write e2e/edit.spec.ts

      - name: Lint (ruff, mypy, eslint, prettier, tsc, OKF validator, no model SDK outside the gateway, log scrubber)
        run: make lint

      - name: Start the local stack (AT-B1-01)
        # The worker runs as the runner's user so it and the host-side seed share ./.data (Linux keeps file owners).
        run: |
          make .env
          printf 'WORKER_UID=%s\nWORKER_GID=%s\n' "$(id -u)" "$(id -g)" >> .env
          make up

      - name: Seed the company repo
        run: make seed

      - name: Unit and integration tests (B1 acceptance tests)
        run: make test

      - name: End-to-end and accessibility (axe)
        run: make e2e

      # Lane D's QA branch only (d/qa-nowrap-phone-1, never merged): the phone screenshots of edit.spec.ts's QA test
      - name: Lane D QA shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-shots
          path: apps/web/test-results/qa-shots
          retention-days: 7
          if-no-files-found: ignore

      - name: Golden sets
        run: make eval

      - name: Container logs carry no idea text or personal data
        id: logcheck
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml --project-directory . --env-file .env \
            logs --no-color --no-log-prefix worker web > container.log
          cd services/worker && uv run --frozen python ../../scripts/ci/check_logs.py ../../container.log

      # IDs-only logs (non-negotiable 3, checked just above), kept for a week so a failure can be diagnosed
      # after the run (BLD-A171). Never a log the check just refused: artifacts are readable by anyone who can
      # read the repo.
      - name: Keep the container logs of a failed run
        if: failure() && steps.logcheck.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: container.log
          retention-days: 7
          if-no-files-found: ignore
