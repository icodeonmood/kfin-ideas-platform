# BLD-A254 proof (throwaway branch a/a254-proof-1, never landed). ci.yml only; journeys off.
# On main (T35, which carries BLD-A254), a FRESH install through the UAT deploy rehearsal on real Docker
# (scripts/uat/rehearse.sh, `make uat-rehearsal`), kept (KEEP=1), in production mode (the launch server's shape) and
# in UAT mode; then read-only checks that deploy step 6/8 switched ai.all off before step 7/8 started the worker, so
# the worker's watch queued nothing while ai.all was on (rehearsal 4, 25 Nov: one desk.text_recheck job on r5/r6).
# Synthetic data only. No secrets: LLM_MODE=fake, EMBEDDINGS_MODE=hash, OIDC_MODE=mock.
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    if: false
    uses: ./.github/workflows/journeys.yml

  gates:
    name: "fresh install (${{ matrix.app_env }}): ai.all off before the worker starts"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app_env: [prod, uat]
    defaults:
      run:
        shell: bash   # -eo pipefail
    steps:
      - uses: actions/checkout@v4

      - name: The runner
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
          echo "docker $(docker version --format '{{.Server.Version}}'), compose $(docker compose version --short)"
          echo "checkout $(git rev-parse HEAD)"
          grep -n 'step "6/8 Model route"' scripts/uat/deploy.sh
          grep -n 'step "7/8 Start the stack"' scripts/uat/deploy.sh

      - name: "Fresh install, APP_ENV=${{ matrix.app_env }}, kept (KEEP=1)"
        run: |
          W="$PWD/.data-uat-rehearsal"
          # On Linux deploy.sh wants the data folder owned by the worker's uid 10001 (what IT did once, UAT.md).
          (
            for _ in $(seq 1 3000); do
              if [[ -d "$W/data" ]]; then
                sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$W/data/ops" "$W/data/backups"
                sudo chown 10001 "$W/data"
                echo "runner: $W/data owned by uid 10001"
                exit 0
              fi
              sleep 0.1
            done
            echo "runner: $W/data did not appear in 300 s"
          ) &
          KEEP=1 REHEARSE_APP_ENV=${{ matrix.app_env }} make uat-rehearsal 2>&1 | tee "$RUNNER_TEMP/install.log"
          wait

      - name: "Checks: ai.all off (audited) before the worker started; nothing queued while it was on"
        run: |
          L="$RUNNER_TEMP/install.log"
          P=kfin-ideas-uat-rehearsal
          FAILED=0
          ok() { echo "check ok: $*"; }
          bad() { echo "check FAILED: $*"; FAILED=1; }
          sql() { docker exec "$P-postgres-1" psql -X -v ON_ERROR_STOP=1 -U ideas -d ideas -tAq -c "$1"; }
          l6="$(grep -n -m1 '^== 6/8 Model route' "$L" | cut -d: -f1)"
          loff="$(grep -n -m1 '^ai.all is now off$' "$L" | cut -d: -f1)"
          l7="$(grep -n -m1 '^== 7/8 Start the stack' "$L" | cut -d: -f1)"
          l8="$(grep -n -m1 '^== 8/8 Smoke tests' "$L" | cut -d: -f1)"
          echo "log lines: 6/8 at ${l6:-?}, 'ai.all is now off' at ${loff:-?}, 7/8 at ${l7:-?}, 8/8 at ${l8:-?}"
          [[ -n "$l6" && -n "$loff" && -n "$l7" && -n "$l8" && "$l6" -lt "$loff" && "$loff" -lt "$l7" && "$l7" -lt "$l8" ]] \
            && ok "the log: 6/8, then ai.all is now off, then 7/8, then 8/8" || bad "the log order"
          grep -q 'smoke: all checks passed' "$L" && ok "smoke: all checks passed" || bad "no smoke pass line"
          state="$(sql "SELECT state || ' ' || coalesce(changed_by, '') FROM kill_switches WHERE name = 'ai.all'")"
          [[ "$state" == "off ops:uat-deploy" ]] && ok "ai.all is off, set by ops:uat-deploy" || bad "ai.all: $state"
          off_at="$(sql "SELECT min(at) FROM audit_log WHERE action = 'kill_switch.set' AND entity = 'kill_switch:ai.all' AND actor = 'ops:uat-deploy' AND after->>'state' = 'off'")"
          started="$(docker inspect -f '{{.State.StartedAt}}' "$P-worker-1")"
          echo "ai.all off audited at: ${off_at:-none}; worker container started at: $started"
          before="$(sql "SELECT ('$off_at'::timestamptz < '$started'::timestamptz)::text")"
          [[ "$before" == "true" ]] && ok "the audited switch-off is before the worker container started" \
            || bad "the switch-off is not before the worker start"
          rechecks="$(sql "SELECT count(*) FROM jobs WHERE type = 'desk.text_recheck'")"
          [[ "$rechecks" == "0" ]] && ok "no desk.text_recheck job (rehearsal 4 found one)" || bad "$rechecks desk.text_recheck jobs"
          echo "jobs by type (counts only):"
          sql "SELECT type || ' ' || state || ' ' || count(*) FROM jobs GROUP BY type, state ORDER BY 1"
          ai_jobs="$(sql "SELECT count(*) FROM jobs WHERE created_at < '$started'::timestamptz")"
          echo "jobs queued before the worker container started: $ai_jobs"
          echo
          if [[ $FAILED -eq 0 ]]; then echo "checks: all passed"; else echo "checks: FAILED"; exit 1; fi

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.app_env }}
          path: ${{ runner.temp }}/install.log
          retention-days: 14
