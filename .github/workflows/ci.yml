# BLD-A256 / r6.1 proof (throwaway branch a/r6hf-proof-1, never landed). ci.yml only; journeys off.
# Each job checks out the r6.1 candidate itself (TO below, exactly; this branch's own commit only changes this file)
# and rehearses IT's upgrade to it on real Docker, in production mode with the file steps (BLD-A237, BLD-A250):
# install FROM in production mode, upgrade to TO, roll back, upgrade again (scripts/uat/rehearse-upgrade.sh, the
# Makefile's uat-rehearsal-upgrade). FROM is r5 in one job and r3 in the other: the two shapes IT's server can be in.
# Synthetic data only. No secrets: LLM_MODE=fake, EMBEDDINGS_MODE=hash, OIDC_MODE=mock.
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TO: "8dfdd98830125db1e1b03762b49ad2fe005b6ee2"

jobs:
  journeys:
    if: false
    uses: ./.github/workflows/journeys.yml

  gates:
    name: "rehearse ${{ matrix.from }} -> r6.1 (prod)"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        from: [launch-2026-11-20-r5, launch-2026-11-20-r3]
    defaults:
      run:
        shell: bash   # -eo pipefail
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TO }}
          fetch-depth: 0   # the launch tags: FROM

      - name: The runner (disk for two builds, Docker, the tags, the exact TO)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
          echo "docker $(docker version --format '{{.Server.Version}}'), compose $(docker compose version --short)"
          echo "FROM ${{ matrix.from }} = $(git rev-parse '${{ matrix.from }}^{commit}')"
          echo "r6   launch-2026-11-20-r6 = $(git rev-parse 'launch-2026-11-20-r6^{commit}')"
          echo "TO   $(git rev-parse HEAD)"
          [[ "$(git rev-parse HEAD)" == "$TO" ]] || { echo "HEAD is not TO"; exit 1; }
          git merge-base --is-ancestor launch-2026-11-20-r6 HEAD && echo "r6 is an ancestor of TO"
          echo "TO changes from r6:"; git diff --stat launch-2026-11-20-r6 HEAD | tail -20
          [[ -z "$(git status --porcelain)" ]] && echo "checkout clean"

      - name: "Install ${{ matrix.from }} in production mode with files, upgrade to r6.1, roll back, upgrade again"
        run: |
          W="$PWD/.data-uat-upgrade-rehearsal"
          # On Linux, the FROM build's deploy.sh wants the data folder owned by the worker's uid 10001, and upgrade.sh
          # wants ops/ and backups/ writable by the deploy account: what IT did once on the launch server (UAT.md).
          # The rehearsal makes $W/data itself and refuses one that is there already, so this waits for it.
          (
            for _ in $(seq 1 3000); do
              if [[ -d "$W/data" ]]; then
                sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$W/data/ops" "$W/data/backups"
                sudo chown 10001 "$W/data"
                echo "runner: $W/data owned by uid 10001; ops/ and backups/ by $(id -un), mode 700"
                exit 0
              fi
              sleep 0.1
            done
            echo "runner: $W/data did not appear in 300 s"
          ) &
          make .env   # the dev env file, as the usual gates make it (gitignored, so the checkout stays clean)
          make uat-rehearsal-upgrade FROM=${{ matrix.from }} REHEARSE_APP_ENV=prod 2>&1 | tee "$RUNNER_TEMP/rehearsal.log"
          wait
          echo
          echo "== summary lines"
          grep -E '^(FROM|TO) |PASS|FAIL|migrations applied now|file checks:|^rehearsal: ' "$RUNNER_TEMP/rehearsal.log" || true
          grep -qx 'rehearsal: upgrade, rollback and upgrade again all passed' "$RUNNER_TEMP/rehearsal.log"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-${{ matrix.from }}
          path: ${{ runner.temp }}/rehearsal.log
          retention-days: 14
