# BLD-C249 proof (throwaway branch c/c249-proof-1, never landed; the product lead's 14:30 note of 26 Nov, as
# a/a241-proof-1 did): journeys off; the gates job installs this checkout in UAT mode with throwaway secrets
# (KEEP=1 make uat-rehearsal), then runs IT's full-mode step 3, scripts/eval/live.sh --server, against that
# kept install with --route bedrock, AWS_REGION in its app env file and no AWS credentials, CI unset for that
# one step. Pass: the paste block lists gatekeeper, judge and draft-part, says the install's llm_calls are
# unchanged and ends EVAL-LIVE: FAIL (<the gates>); no STOP line.
# CI for kfin-ideas-platform. The Makefile is the contract; this file only calls it, so the same gates can
# move to KFin's own CI (GitLab, Azure DevOps) unchanged when IT provides the internal repo (BLD-026).
# Synthetic data only. No secrets are needed: LLM_MODE=fake, EMBEDDINGS_MODE=hash, OIDC_MODE=mock.
name: ci

# Every code push to main and every pull request runs the full gates (DEC-093, BLD-159); a newer push cancels the
# run still going for the same branch, and pushes that change only docs skip it. Also by hand (Run workflow).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]  # docs and top-level notes only; seed and agent Markdown still run it
  pull_request:
    paths-ignore: ["docs/**", "*.md"]  # docs and top-level notes only; seed and agent Markdown still run it
  workflow_dispatch:

concurrency:
  # On main every commit gets its own check, so a new push never cancels the one already running (BLD-A184:
  # 5 of 25 main runs were cancelled on 16 Nov). Other branches keep only their latest run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Off for the BLD-C249 proof.
  journeys:
    if: false
    uses: ./.github/workflows/journeys.yml

  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The rehearsal builds the images; the host tools it uses are bash, git, docker, make and openssl.
      - name: The runner (disk, Docker, no AWS credentials in its environment)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
          echo "docker $(docker version --format '{{.Server.Version}}'), compose $(docker compose version --short)"
          echo "checkout $(git rev-parse HEAD)"
          echo "AWS_* names in the runner's environment: $(env | grep -c '^AWS_' || true)"

      - name: "1. Install this checkout in UAT mode with throwaway secrets, kept (KEEP=1 make uat-rehearsal)"
        run: |
          set -o pipefail
          make .env   # the rehearsal stops the dev stack first (make down), which reads .env; a fresh runner has none
          KEEP=1 make uat-rehearsal 2>&1 | tee "$RUNNER_TEMP/rehearsal.log"
          grep -x 'Production-mode rehearsal passed.' "$RUNNER_TEMP/rehearsal.log"
          echo "== kept"
          docker ps --filter label=com.docker.compose.project=kfin-ideas-uat-rehearsal --format '{{.Names}} {{.Status}}' \
            | LC_ALL=C sort

      - name: "2. The Bedrock route: AWS_REGION in the install's app env file, no AWS credentials"
        run: |
          A="$GITHUB_WORKSPACE/.data-uat-rehearsal/app.env"
          for n in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_BEARER_TOKEN_BEDROCK; do
            if grep -q "^$n=" "$A"; then echo "the app env file names $n: not a keyless proof"; exit 1; fi
          done
          grep -q '^AWS_REGION=' "$A" || echo 'AWS_REGION=ap-south-1' >> "$A"
          echo "app env file: AWS_REGION set, no AWS credential names (names only; the file is never printed)"

      - name: "3. IT's full-mode step 3 against the kept install, with CI unset for this step only"
        run: |
          set +e
          sudo env -u CI -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN -u AWS_BEARER_TOKEN_BEDROCK \
            scripts/eval/live.sh --server --checkout "$GITHUB_WORKSPACE" --project kfin-ideas-uat-rehearsal \
            --app-env "$GITHUB_WORKSPACE/.data-uat-rehearsal/app.env" --route bedrock 2>&1 | tee "$RUNNER_TEMP/live.log"
          echo "live.sh exit status: ${PIPESTATUS[0]}"

      - name: "4. The checks"
        run: |
          L="$RUNNER_TEMP/live.log"
          FAILED=0
          ok() { echo "check ok: $*"; }
          bad() { echo "check FAILED: $*"; FAILED=1; }
          block="$(sed -n '/^=== PASTE FROM HERE ===$/,/^=== PASTE TO HERE ===$/p' "$L")"
          if [[ -n "$block" ]]; then ok "a paste block"; else bad "no paste block"; fi
          for a in gatekeeper judge draft-part; do
            if grep -q "^agent $a" <<<"$block"; then ok "an agent line for $a"; else bad "no agent line for $a"; fi
          done
          if grep -q '^install database: llm_calls unchanged' <<<"$block"; then
            ok "$(grep '^install database:' <<<"$block")"
          else
            bad "no 'install database: llm_calls unchanged' line"
          fi
          last="$(grep -v '^=== PASTE TO HERE ===$' <<<"$block" | tail -1)"
          if [[ "$last" == "EVAL-LIVE: FAIL ("* ]]; then ok "the last line: $last"; else bad "the last line: $last"; fi
          if grep -q '^STOP: ' "$L"; then bad "a STOP line: $(grep '^STOP: ' "$L")"; else ok "no STOP line"; fi
          if grep -q 'eval-live refused' "$L"; then bad "$(grep 'eval-live refused' "$L")"; else ok "not refused"; fi
          echo "$FAILED" > "$RUNNER_TEMP/failed"
          exit "$FAILED"

      - name: Teardown
        if: always()
        run: |
          W="$GITHUB_WORKSPACE/.data-uat-rehearsal"
          UAT_APP_ENV_FILE="$W/app.env" UAT_DATA_DIR="$W/data" docker compose -p kfin-ideas-uat-rehearsal \
            -f infra/docker-compose.yml -f infra/uat/compose.uat.yml --project-directory . \
            --env-file "$W/app.env" --env-file "$W/db.env" down -v --remove-orphans >/dev/null 2>&1 || true
          echo "torn down"
