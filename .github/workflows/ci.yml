# CI for kfin-ideas-platform. The Makefile is the contract; this file only calls it, so the same gates can
# move to KFin's own CI (GitLab, Azure DevOps) unchanged when IT provides the internal repo (BLD-026).
# Synthetic data only. No secrets are needed: LLM_MODE=fake, EMBEDDINGS_MODE=hash, OIDC_MODE=mock.
#
# BLD-A241 proof (throwaway branch a/a241-proof-1, never landed): journeys off; the gates job installs
# launch-2026-11-20-r5 in UAT mode with synthetic people through the upgrade rehearsal (KEEP=1), then runs the
# restore drill against that kept stack on real Docker and a real Postgres 16: a pass, a refusal, a second pass.
name: ci

# Every code push to main and every pull request runs the full gates (DEC-093, BLD-159); a newer push cancels the
# run still going for the same branch, and pushes that change only docs skip it. Also by hand (Run workflow).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]  # docs and top-level notes only; seed and agent Markdown still run it
  pull_request:
    paths-ignore: ["docs/**", "*.md"]  # docs and top-level notes only; seed and agent Markdown still run it
  workflow_dispatch:

concurrency:
  # On main every commit gets its own check, so a new push never cancels the one already running (BLD-A184:
  # 5 of 25 main runs were cancelled on 16 Nov). Other branches keep only their latest run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Off for the BLD-A241 proof.
  journeys:
    if: false
    uses: ./.github/workflows/journeys.yml

  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash   # -eo pipefail
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the launch tags: FROM=launch-2026-11-20-r5

      # The rehearsal builds two versions of the images (r5 and this checkout); the host tools it uses are bash,
      # git, docker, make and openssl, so no uv, node or npm install.
      - name: The runner (disk for two builds, Docker, the tags)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
          echo "docker $(docker version --format '{{.Server.Version}}'), compose $(docker compose version --short)"
          echo "FROM launch-2026-11-20-r5 = $(git rev-parse 'launch-2026-11-20-r5^{commit}')"
          echo "TO   $(git rev-parse HEAD)"
          echo "dev stack containers: $(docker ps -q --filter label=com.docker.compose.project=kfin-ideas | wc -l)"

      - name: "1. Install r5 in UAT mode (synthetic people), upgrade, roll back, upgrade again; kept (KEEP=1)"
        run: |
          W="$PWD/.data-uat-upgrade-rehearsal"
          # On Linux, r5's deploy.sh wants the data folder owned by the worker's uid 10001, and upgrade.sh wants ops/
          # and backups/ writable by the deploy account: what IT did once on the launch server (docs/UAT.md). The
          # rehearsal makes $W/data itself and refuses one that is there already, so this waits for it (the install
          # builds its images first, minutes before it reads the folder's owner).
          (
            for _ in $(seq 1 3000); do
              if [[ -d "$W/data" ]]; then
                sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$W/data/ops" "$W/data/backups"
                sudo chown 10001 "$W/data"
                echo "runner: $W/data owned by uid 10001; ops/ and backups/ by $(id -un), mode 700"
                exit 0
              fi
              sleep 0.1
            done
            echo "runner: $W/data did not appear in 300 s"
          ) &
          KEEP=1 make uat-rehearsal-upgrade FROM=launch-2026-11-20-r5 2>&1 | tee "$RUNNER_TEMP/rehearsal.log"
          wait
          echo
          echo "== after the rehearsal (kept)"
          grep -x 'rehearsal: upgrade, rollback and upgrade again all passed' "$RUNNER_TEMP/rehearsal.log"
          docker ps --filter label=com.docker.compose.project=kfin-ideas-uat-rehearsal --format '{{.Names}} {{.Status}}' \
            | LC_ALL=C sort
          echo "postgres $(docker exec kfin-ideas-uat-rehearsal-postgres-1 psql -X -U ideas -d postgres -tAc 'SHOW server_version')"
          echo "ops/:"; ls -1 "$W/data/ops"
          echo "backups/:"; ls -1 "$W/data/backups"

      # Helpers for the drill's steps, in the runner's temp folder (never in the checkout). They print counts, names,
      # paths, IDs and lines only, never a row.
      - name: The drill's checks
        run: |
          cat > "$RUNNER_TEMP/drill-checks.sh" <<'SH'
          W="$GITHUB_WORKSPACE/.data-uat-upgrade-rehearsal"
          PROJECT=kfin-ideas-uat-rehearsal
          PG="$PROJECT-postgres-1"
          HINT="  docker exec $PG psql -U ideas -d postgres -c \"DROP DATABASE ideas_restore_drill WITH (FORCE)\""
          FAILED=0
          ok() { echo "check ok: $*"; }
          bad() { echo "check FAILED: $*"; FAILED=1; }
          n() { grep -c . || true; }
          sql() { docker exec "$PG" psql -X -v ON_ERROR_STOP=1 -U ideas -d "$1" -tAq -c "$2"; }
          drill_dbs() { sql postgres "SELECT count(*) FROM pg_database WHERE datname = 'ideas_restore_drill'" || echo '?'; }
          backups() { find "$W/data/backups" -mindepth 1 -maxdepth 1 -printf '%f %s\n' | LC_ALL=C sort; }
          records() { find "$W/data/ops" -maxdepth 1 -name 'restore-drill-*.json' | LC_ALL=C sort; }
          run_drill() {  # <log>: the drill as IT runs it, its whole output; DRILL_RC is its exit status
            DRILL_RC=0
            UAT_DATA_DIR="$W/data" UAT_PROJECT="$PROJECT" DRILL_WHERE="github runner" \
              make uat-restore-drill APP_ENV_FILE="$W/app.env" DB_ENV_FILE="$W/db.env" 2>&1 | tee "$1" || DRILL_RC=$?
            echo "drill exit status: $DRILL_RC"
          }
          common_after() {  # <backups/ before> <records wanted>: what every run leaves, a pass or a refusal
            [[ ! -e "$W/data/ops/.lock" ]] && ok "the lock ops/.lock is gone" || bad "ops/.lock is still there"
            [[ "$(find "$W/data/backups" -maxdepth 1 -name 'restore-drill-*.dump' | n)" -eq 0 ]] \
              && ok "no restore-drill-*.dump in backups/" || bad "a restore-drill-*.dump is left in backups/"
            if [[ "$(backups)" == "$1" ]]; then
              ok "backups/ exactly as before the drill: $(n <<< "$1") entries, $(grep -c '^upgrade-.*\.dump ' <<< "$1" || true) upgrade dumps"
            else
              bad "backups/ changed"; diff <(printf '%s\n' "$1") <(backups) || true
            fi
            [[ "$(docker exec "$PG" sh -c 'ls /tmp/restore-drill-*.counts 2>/dev/null' | n)" -eq 0 ]] \
              && ok "no counts file left in the postgres container" || bad "a counts file is left in the postgres container"
            [[ "$(records | n)" -eq "$2" ]] && ok "$2 restore-drill record(s) in ops/" \
              || bad "$(records | n) restore-drill records in ops/, $2 wanted"
          }
          check_pass() {  # <log> <backups/ before> <records wanted>
            local log="$1" last re tables="" cmp catalog rec
            echo; echo "== checks"
            [[ "$DRILL_RC" -eq 0 ]] && ok "the drill exited 0" || bad "the drill exited $DRILL_RC"
            last="$(tail -n 1 "$log")"
            re='^restore drill: passed in ([0-9]+)s \(([0-9]+) tables, counts equal\)$'
            if [[ "$last" =~ $re ]]; then
              tables="${BASH_REMATCH[2]}"
              ok "the last line is the pass line: ${BASH_REMATCH[1]} s, $tables tables"
            else
              bad "the last line is not the pass line: $last"
            fi
            [[ "$(grep -E '^== [1-6]/6 ' "$log" | n)" -eq 6 ]] && ok "six == n/6 lines" || bad "not six == n/6 lines"
            cmp="$(grep -E '^compare: ' "$log" || true)"
            re='^compare: ([0-9]+) tables, the same in both; every count equal; schema_migrations at ([0-9]+) in both$'
            if [[ "$cmp" =~ $re && "${BASH_REMATCH[1]}" == "${tables:-x}" ]]; then
              ok "the compare line: ${BASH_REMATCH[1]} tables, schema_migrations at ${BASH_REMATCH[2]}"
            else
              bad "the compare line: ${cmp:-(none)}"
            fi
            catalog="$(sql ideas "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p')" || echo '?')"
            [[ "$catalog" == "${tables:-x}" ]] && ok "ideas has $catalog tables in schema public (catalog), all compared" \
              || bad "ideas has $catalog tables in schema public; the drill compared ${tables:-?}"
            [[ "$(drill_dbs)" == "0" ]] && ok "ideas_restore_drill no longer exists" || bad "ideas_restore_drill still exists"
            rec="$(sed -nE 's#^recorded: ([^ ]+\.json) .*#\1#p' "$log")"
            if [[ "$rec" == "$W/data/ops/restore-drill-"*.json && -f "$rec" ]] && jq -e '(keys == ["at", "passed", "seconds", "where"]) and .passed == true and (.seconds | type) == "number" and .where == "github runner" and (.at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' "$rec" > /dev/null; then
              ok "the record $(basename "$rec") has exactly passed, seconds, where, at; passed true: $(cat "$rec")"
            else
              bad "the record ${rec:-(none)}"
            fi
            common_after "$2" "$3"
          }
          check_refusal() {  # <log> <backups/ before> <records wanted>
            local log="$1"
            echo; echo "== checks"
            [[ "$DRILL_RC" -ne 0 ]] && ok "the drill exited $DRILL_RC (not 0)" || bad "the drill exited 0"
            grep -qxF -- "$HINT" "$log" && ok "it printed the DROP command:$HINT" || bad "it did not print the DROP command"
            grep -qxF 'STOPPED: ideas_restore_drill already exists' "$log" \
              && ok "it printed STOPPED: ideas_restore_drill already exists" || bad "no STOPPED: ideas_restore_drill already exists"
            grep -qxF 'restore drill: FAILED (checks)' "$log" && ok "it printed restore drill: FAILED (checks)" \
              || bad "no restore drill: FAILED (checks)"
            ! grep -qE '^== 2/6 ' "$log" && ok "it stopped in 1/6 (no backup started)" || bad "it went past 1/6"
            ! grep -q '^dropped ' "$log" && ok "it dropped nothing" || bad "it printed a dropped line"
            [[ "$(drill_dbs)" == "1" ]] && ok "ideas_restore_drill still exists" || bad "ideas_restore_drill is gone"
            common_after "$2" "$3"
          }
          finish() {
            echo
            if [[ $FAILED -eq 0 ]]; then echo "checks: all passed"; else echo "checks: FAILED"; exit 1; fi
          }
          SH
          bash -n "$RUNNER_TEMP/drill-checks.sh" && echo "drill-checks.sh: $(wc -l < "$RUNNER_TEMP/drill-checks.sh") lines"

      - name: "2. The restore drill against the kept stack (first run), and its checks"
        run: |
          . "$RUNNER_TEMP/drill-checks.sh"
          before="$(backups)"
          echo "backups/ before the drill:"; printf '%s\n' "$before"
          run_drill "$RUNNER_TEMP/drill-1.log"
          check_pass "$RUNNER_TEMP/drill-1.log" "$before" 1
          finish

      - name: "3. The refusal: ideas_restore_drill made by hand first; then dropped with the command the drill printed"
        run: |
          . "$RUNNER_TEMP/drill-checks.sh"
          sql postgres "CREATE DATABASE ideas_restore_drill"
          [[ "$(drill_dbs)" == "1" ]] && ok "made ideas_restore_drill by hand" || bad "could not make ideas_restore_drill"
          before="$(backups)"
          run_drill "$RUNNER_TEMP/drill-refusal.log"
          check_refusal "$RUNNER_TEMP/drill-refusal.log" "$before" 1
          echo; echo "== dropping it with the command the drill printed"
          bash -c "${HINT#  }"
          [[ "$(drill_dbs)" == "0" ]] && ok "ideas_restore_drill dropped" || bad "ideas_restore_drill is still there"
          finish

      - name: "4. A second clean run, and its checks"
        run: |
          . "$RUNNER_TEMP/drill-checks.sh"
          before="$(backups)"
          run_drill "$RUNNER_TEMP/drill-2.log"
          check_pass "$RUNNER_TEMP/drill-2.log" "$before" 2
          for r in $(records); do
            jq -e '.passed == true' "$r" > /dev/null && ok "$(basename "$r"): passed true" || bad "$(basename "$r"): not passed"
          done
          finish

      - name: Teardown
        if: always()
        run: |
          W="$PWD/.data-uat-upgrade-rehearsal"
          if [[ -f "$W/app.env" && -f "$W/db.env" ]]; then
            UAT_APP_ENV_FILE="$W/app.env" UAT_DATA_DIR="$W/data" docker compose -p kfin-ideas-uat-rehearsal \
              -f infra/docker-compose.yml -f infra/uat/compose.uat.yml --project-directory . \
              --env-file "$W/app.env" --env-file "$W/db.env" down -v --remove-orphans > /dev/null 2>&1 || true
          fi
          sudo rm -rf "$W"
          git worktree prune
          echo "containers left in kfin-ideas-uat-rehearsal: $(docker ps -aq --filter label=com.docker.compose.project=kfin-ideas-uat-rehearsal | wc -l)"
