# The journey suite (lane G, apps/web/journeys/): every journey in 1pc-handoff/03-journeys/, end to end.
# Same set-up as the gates job in ci.yml, plus the 1% Club seed and a provider that answers a silent sign-in as
# Entra ID does (BLD-A197); runs only this suite. Synthetic data only; no secrets (LLM_MODE=fake,
# EMBEDDINGS_MODE=hash, OIDC_MODE=mock). Part of the gates since Thu 19 Nov (BLD-A230): ci.yml calls it on every
# run off main (a pull request, or a run by hand on a branch); main is walked from its own push trigger below.
name: journeys

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:
  workflow_call:

# One run at a time on main, never cancelled once started: each walk reads the latest completed run. While one runs,
# only the newest push waits (an older waiting run gives way), and pushes that change only docs are not walked.
# Off main the group also carries the workflow's name: called from ci.yml it is "ci", run by hand it is "journeys".
# So a builder's run by hand never queues behind, or cancels, the walk CI runs on the same branch, nor one on main.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'journeys-main' || format('journeys-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd services/worker && uv sync --frozen
          cd ../../apps/web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Start the local stack
        # The worker runs as the runner's user so it and the host-side seed share ./.data (Linux keeps file owners).
        # The one difference from ci.yml (BLD-A197): the mock identity provider moves to :8091 and a proxy takes its
        # place on :8090, answering a silent try (prompt=none) with login_required, as Entra ID answers a browser
        # with no session, instead of the mock's login form. J-SHARE/1 and J-SHARE/2 walk that answer to S-02. The
        # web container still reaches the mock inside Docker, and the proxy passes everything else on unchanged.
        run: |
          make .env
          printf 'WORKER_UID=%s\nWORKER_GID=%s\n' "$(id -u)" "$(id -g)" >> .env
          sed -i 's/^MOCK_OIDC_PORT=.*/MOCK_OIDC_PORT=8091/' .env
          grep -qx 'MOCK_OIDC_PORT=8091' .env
          nohup python3 scripts/ci/oidc_silent_shim.py --listen 8090 --upstream 8091 \
            > "$RUNNER_TEMP/oidc-shim.log" 2>&1 &
          # A dead proxy would otherwise show only after the stack's build and make up's 120 s health wait, as
          # mock-oidc failing. Here it fails at once, by name, with its log. Any HTTP answer counts, even the proxy's
          # own 502: nothing is behind it yet, as the mock starts with make up below.
          ok=""
          for _ in 1 2 3 4 5; do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:8090/; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "The sign-in proxy on :8090 did not answer."; cat "$RUNNER_TEMP/oidc-shim.log"; exit 1; }
          make up

      - name: Seed the company repo
        run: make seed

      - name: Load the 1% Club seed (BLD-E009)
        run: make demo DEMO_SET=1pc

      - name: Journeys
        id: journeys
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000
          OIDC_ISSUER: http://localhost:8090/default
          E2E_DATABASE_URL: postgres://ideas:ideas@localhost:5432/ideas?sslmode=disable
        run: npx playwright test -c journeys/playwright.config.ts --grep J-BROWSE --repeat-each 20 --retries 0

      - name: Board (journey × step)
        if: always()
        run: |
          if [ -f apps/web/test-results/journeys/board.md ]; then
            cat apps/web/test-results/journeys/board.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No board: the suite did not run (see the failed step)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-shots
          path: apps/web/test-results/journeys/shots
          retention-days: 7
          if-no-files-found: ignore

      # BLD-G005: the same terms as ci.yml's container-logs step (BLD-A171). The web and worker logs are checked for
      # idea text and personal data (non-negotiable 3) on every run, and kept for a week only when the journeys
      # failed, so a stall like J-BROWSE/4's on 21 Nov can be read after the run. Never a log the check refused:
      # artifacts are readable by anyone who can read the repo. The name differs from ci.yml's, as ci.yml calls this
      # workflow in the same run.
      - name: Journeys container logs carry no idea text or personal data
        id: journeys_logcheck
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml --project-directory . --env-file .env \
            logs --no-color --no-log-prefix web worker > journeys-container.log
          cd services/worker && uv run --frozen python ../../scripts/ci/check_logs.py ../../journeys-container.log

      - name: Keep the container logs of failed journeys
        if: failure() && steps.journeys_logcheck.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: journeys-container-logs
          path: journeys-container.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the report and board
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-report
          path: |
            apps/web/playwright-report/journeys
            apps/web/test-results/journeys/board.md
            apps/web/test-results/journeys/results.json
          retention-days: 7
          if-no-files-found: ignore
