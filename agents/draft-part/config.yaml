# draft-part — one part of the live draft (L-DRAFT.parts), asked once per part, the parts in parallel. Bump `version`
# and add a CHANGELOG line on any change; `make eval` must pass.
name: draft-part
version: 0.1.2
tier: fast
model: claude-haiku-5-5
effort: low             # no temperature: current models reject non-default sampling (BLD-070)
thinking: "off"          # the loader's means are about one to two seconds a part
max_tokens: 700
timeout_s: 6
latency_budget_s: 3
retries_on_invalid: 1
cache_ttl_days: 30
input_blocks:
- part
- words
- options
untrusted_blocks:
- words
examples_in_prompt:
- 01-title.json
- 03-who.json
- 06-not-in-the-words.json
fake_mode_default: 06-not-in-the-words.json
golden_set: eval/golden/draft_part.jsonl
post_checks:
- only the asked part is filled; the others stay empty
- every answer quotes the person's own words (words[].text, never the English copy); unsupported answers are dropped after one re-ask (DEC-095)
- numbers only as the person gave them; no figures worked out and no assumptions (DEC-097 lists none for the draft)
- who and area only from options.choices; worth only from its ids, "not sure yet" alone
- no tags in title, summary, often or reason (they are shown to the person and, once shared, to others)
- title at most 70 characters; summary at most 3 sentences ("Rs." and "e.g." do not end one)
pass_gates:
  ungrounded_after_gateway: 0
  out_of_list: 0
  tags_in_text: 0
  expectations_min: 0.8
  dropped_max: 1                   # of 12: answers still unbacked after the re-ask, dropped by the gateway (BLD-C035)
  first_attempt_problems_max: 2    # of 12: answers the checks refused on the first ask (each re-ask doubles a part's wait)
